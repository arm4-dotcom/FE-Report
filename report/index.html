<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>FE Report</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f2f4f7; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 14px; color: #555; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="loading">กำลังเปิด FE Report…</div>
  <iframe id="app" title="FE Report" allow="clipboard-write; fullscreen"></iframe>
  <script>
    // หน้าครอบ: ฝังเว็บ Apps Script ของ Dashboard ไว้ใน iframe (?embed=1)
    // - ไม่แสดงแถบ "สร้างโดยผู้ใช้ Google Apps Script" และไม่โชว์ token ในแถบที่อยู่
    // - หน้าใน Apps Script เปลี่ยนหน้าโดยส่ง postMessage({type:'fe-nav', url}) มาที่หน้านี้ แล้วหน้านี้เปลี่ยน src ของ iframe
    var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwO83iIKNBpsxh2BvzZV92NjgDZFc5FfYsb1cyPz9za6vBBh7LAqadUfgzypT9PhRjP8A/exec';
    var frame = document.getElementById('app');

    frame.addEventListener('load', function () { document.getElementById('loading').style.display = 'none'; });
    frame.src = EXEC_URL + '?embed=1';

    window.addEventListener('message', function (e) {
      var host = '';
      try { host = new URL(e.origin).hostname; } catch (err) { return; }
      // รับคำสั่งเฉพาะจากหน้าของ Apps Script (โดเมน googleusercontent.com)
      if (!/(^|\.)googleusercontent\.com$/.test(host)) return;
      var d = e.data || {};
      if (d.type !== 'fe-nav' || typeof d.url !== 'string') return;
      // อนุญาตเฉพาะลิงก์ของเว็บแอปนี้เท่านั้น
      if (d.url.indexOf(EXEC_URL) !== 0) return;
      document.getElementById('loading').style.display = 'flex';
      frame.src = d.url;
    });
  </script>
</body>
</html>
