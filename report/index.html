<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0A8FD8">
  <title>FE Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Kanit:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* v2.2.0 — ธีม Sky Blue: เปลี่ยนเฉพาะสี/หน้าจอตอนโหลด (สคริปต์ด้านล่างเหมือนเดิม) */
    html, body { margin: 0; height: 100%; }
    body { background: #0A8FD8; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center;
      font-family: 'Poppins', 'Kanit', 'Segoe UI', Tahoma, sans-serif; font-size: 15px; color: #fff; pointer-events: none;
      background: #0A8FD8;
    }
    #loading .mark {
      width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: #fff; color: #0670AE; font-weight: 700; font-size: 19px; letter-spacing: .3px;
      box-shadow: 0 10px 26px -8px rgba(4, 52, 89, 0.55);
    }
    #loading .bar { width: 140px; height: 4px; border-radius: 999px; background: rgba(255, 255, 255, 0.3); overflow: hidden; }
    #loading .bar i { display: block; width: 40%; height: 100%; border-radius: 999px; background: #fff; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #loading .bar i { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="loading" role="status">
    <div class="mark" aria-hidden="true">FE</div>
    <div>กำลังเปิด FE Report…</div>
    <div class="bar" aria-hidden="true"><i></i></div>
  </div>
  <iframe id="app" title="FE Report" allow="clipboard-write; fullscreen"></iframe>
  <script>
    // หน้าครอบ: ฝังเว็บ Apps Script ของ Dashboard ไว้ใน iframe (?embed=1)
    // - ไม่แสดงแถบ "สร้างโดยผู้ใช้ Google Apps Script" และไม่โชว์ token ในแถบที่อยู่
    // - หน้าใน Apps Script เปลี่ยนหน้าโดยส่ง postMessage({type:'fe-nav', url}) มาที่หน้านี้ แล้วหน้านี้เปลี่ยน src ของ iframe
    var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwO83iIKNBpsxh2BvzZV92NjgDZFc5FfYsb1cyPz9za6vBBh7LAqadUfgzypT9PhRjP8A/exec';
    var frame = document.getElementById('app');

    frame.addEventListener('load', function () { document.getElementById('loading').style.display = 'none'; });
    frame.src = EXEC_URL + '?embed=1';

    window.addEventListener('message', function (e) {
      var host = '';
      try { host = new URL(e.origin).hostname; } catch (err) { return; }
      // รับคำสั่งเฉพาะจากหน้าของ Apps Script (โดเมน googleusercontent.com)
      if (!/(^|\.)googleusercontent\.com$/.test(host)) return;
      var d = e.data || {};
      if (d.type !== 'fe-nav' || typeof d.url !== 'string') return;
      // อนุญาตเฉพาะลิงก์ของเว็บแอปนี้เท่านั้น
      if (d.url.indexOf(EXEC_URL) !== 0) return;
      document.getElementById('loading').style.display = 'flex';
      frame.src = d.url;
    });
  </script>
</body>
</html>
