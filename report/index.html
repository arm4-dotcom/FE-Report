<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#F3F6FB">
  <title>FE Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* v2.1.0 — ธีม A×C: เปลี่ยนเฉพาะสี/หน้าจอตอนโหลด (สคริปต์ด้านล่างเหมือนเดิม) */
    html, body { margin: 0; height: 100%; }
    body {
      background-color: #F3F6FB;
      background-image:
        linear-gradient(rgba(36, 87, 255, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(36, 87, 255, 0.055) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center;
      font-family: 'Kanit', 'Segoe UI', Tahoma, sans-serif; font-size: 15px; color: #344054; pointer-events: none;
      background-color: #F3F6FB;
      background-image:
        linear-gradient(rgba(36, 87, 255, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(36, 87, 255, 0.055) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    #loading .mark {
      width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
      background: #2457FF; color: #fff; font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; font-size: 18px; letter-spacing: .5px;
      box-shadow: 0 0 0 5px #EAF0FF, 0 8px 24px rgba(36, 87, 255, 0.35);
    }
    #loading .bar { width: 140px; height: 3px; border-radius: 999px; background: #E1E7F2; overflow: hidden; }
    #loading .bar i {
      display: block; width: 40%; height: 100%; border-radius: 999px; background: #2457FF;
      box-shadow: 0 0 10px rgba(36, 87, 255, 0.5); animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #loading .bar i { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="loading" role="status">
    <div class="mark" aria-hidden="true">FE</div>
    <div>กำลังเปิด FE Report…</div>
    <div class="bar" aria-hidden="true"><i></i></div>
  </div>
  <iframe id="app" title="FE Report" allow="clipboard-write; fullscreen"></iframe>
  <script>
    // หน้าครอบ: ฝังเว็บ Apps Script ของ Dashboard ไว้ใน iframe (?embed=1)
    // - ไม่แสดงแถบ "สร้างโดยผู้ใช้ Google Apps Script" และไม่โชว์ token ในแถบที่อยู่
    // - หน้าใน Apps Script เปลี่ยนหน้าโดยส่ง postMessage({type:'fe-nav', url}) มาที่หน้านี้ แล้วหน้านี้เปลี่ยน src ของ iframe
    var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwO83iIKNBpsxh2BvzZV92NjgDZFc5FfYsb1cyPz9za6vBBh7LAqadUfgzypT9PhRjP8A/exec';
    var frame = document.getElementById('app');

    frame.addEventListener('load', function () { document.getElementById('loading').style.display = 'none'; });
    frame.src = EXEC_URL + '?embed=1';

    window.addEventListener('message', function (e) {
      var host = '';
      try { host = new URL(e.origin).hostname; } catch (err) { return; }
      // รับคำสั่งเฉพาะจากหน้าของ Apps Script (โดเมน googleusercontent.com)
      if (!/(^|\.)googleusercontent\.com$/.test(host)) return;
      var d = e.data || {};
      if (d.type !== 'fe-nav' || typeof d.url !== 'string') return;
      // อนุญาตเฉพาะลิงก์ของเว็บแอปนี้เท่านั้น
      if (d.url.indexOf(EXEC_URL) !== 0) return;
      document.getElementById('loading').style.display = 'flex';
      frame.src = d.url;
    });
  </script>
</body>
</html>
